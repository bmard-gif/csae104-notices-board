<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Weekly submissions for Web Programming.">
  <meta name="theme-color" content="#800000">
  <title>Web Programming</title>
  <link rel="icon" type="image/png" href="https://www.pup.edu.ph/resources/images/logo.png">
  <style>
    :root {
      --brand: #800000;
      --brand-dark: #5c0000;
      --accent: #f5c518;
      --on-accent: #3d0000;
      --page: #f7f5f2;
      --dot: rgba(128, 0, 0, .08);
      --surface: #ffffff;
      --text: #231f20;
      --muted: #5f5557;
      --link: #800000;
      --border: #ddd4d4;
      color-scheme: light dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background-color: var(--page);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.5px);
      background-size: 18px 18px;
    }

    /* The card */
    main {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(60, 0, 0, .14);
    }

    header {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      border-bottom: 5px solid var(--accent);
      color: #ffffff;
      text-align: center;
      padding: 32px 24px 28px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 7vw, 2.1rem);
      line-height: 1.2;
      margin: 0;
    }
    header p {
      margin: 8px 0 0;
      color: var(--accent);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    /* Week links */
    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 24px;
    }
    a {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    a:hover {
      border-color: var(--link);
      box-shadow: 0 6px 16px rgba(60, 0, 0, .14);
      transform: translateY(-2px);
    }
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .number {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .label { display: grid; }
    .label strong { font-size: 1.05rem; }
    .label small { color: var(--muted); font-size: .85rem; }
    .arrow {
      margin-left: auto;
      color: var(--link);
      font-size: 1.35rem;
      transition: transform .2s;
    }
    a:hover .arrow { transform: translateX(4px); }

    /* Small phones: less spacing so the text stays on one line */
    @media (max-width: 380px) {
      ul { padding: 16px; }
      a { gap: 12px; padding: 12px; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --brand: #8f1d24;
        --brand-dark: #6e1218;
        --page: #171112;
        --dot: rgba(255, 255, 255, .06);
        --surface: #251a1c;
        --text: #f1e7e8;
        --muted: #c9b6b8;
        --link: #f5c518;
        --border: #4a3436;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      a, .arrow { transition: none; }
      a:hover, a:hover .arrow { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Web Programming</h1>
      <p>Submissions</p>
    </header>

    <nav aria-label="Weekly submissions">
      <ul>
        <li>
          <a href="Week%201/index.html">
            <span class="number" aria-hidden="true">1</span>
            <span class="label"><strong>Week 1</strong><small>View submission</small></span>
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
        <li>
          <a href="Week%202/index.html">
            <span class="number" aria-hidden="true">2</span>
            <span class="label"><strong>Week 2</strong><small>View submission</small></span>
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
        <li>
          <a href="Week%203/index.html">
            <span class="number" aria-hidden="true">3</span>
            <span class="label"><strong>Week 3</strong><small>View submission</small></span>
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
      </ul>
    </nav>
  </main>
</body>
</html>
